name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate standalone door dependencies
        run: python tests/test_standalone_dependencies.py
      - name: Compile Python validation code
        run: python -m compileall -q tests
      - name: Check whitespace errors
        run: git diff --check
